services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: allocator
      POSTGRES_PASSWORD: allocator
      POSTGRES_DB: allocator
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U allocator -d allocator"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://allocator:allocator@postgres:5432/allocator
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app/app
      - ./backend/alembic:/app/alembic
      - ./backend/tests:/app/tests
      - ./sample_data:/sample_data:ro
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: ./frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/index.html:/app/index.html
    environment:
      VITE_PROXY_TARGET: http://api:8000
    depends_on:
      - api

volumes:
  postgres_data:
